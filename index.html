  <body>
    <!-- Desktop Canvas -->
    <div id="desktop">
      <!-- Desktop Shortcuts container -->
      <div class="desktop-shortcuts">
        <div class="shortcut">
          <div class="shortcut-icon">📁</div>
          <span class="os-label">Documents</span>
        </div>
      </div>

      <!-- Dock Area -->
      <div id="dock" class="backdrop-glass">
        <div class="dock-icon" data-app="finder">
          <span class="icon-emoji">📁</span>
          <span class="os-label">Finder</span>
          <div class="dock-dot"></div>
        </div>
        <div class="dock-icon" data-app="notes">
          <span class="icon-emoji">📝</span>
          <span class="os-label">Notes</span>
          <div class="dock-dot"></div>
        </div>
        <div class="dock-icon" data-app="calculator">
          <span class="icon-emoji">🧮</span>
          <span class="os-label">Calculator</span>
          <div class="dock-dot"></div>
        </div>
        <div class="dock-icon" data-app="settings">
          <span class="icon-emoji">⚙️</span>
          <span class="os-label">Settings</span>
          <div class="dock-dot"></div>
        </div>
        <div class="dock-icon" data-app="monitor">
          <span class="icon-emoji">📊</span>
          <span class="os-label">Monitor</span>
          <div class="dock-dot"></div>
        </div>
        <div class="dock-icon" data-app="store">
          <span class="icon-emoji">🛒</span>
          <span class="os-label">Store</span>
          <div class="dock-dot"></div>
        </div>
        <div class="dock-separator"></div>
        <div class="dock-icon" data-app="trash">
          <span class="icon-emoji">🗑️</span>
          <span class="os-label">Trash</span>
          <div class="dock-dot"></div>
        </div>
      </div>
    </div>
  </body>
